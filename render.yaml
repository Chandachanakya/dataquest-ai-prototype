services:
  # FastAPI Backend
  - type: web
    name: dataquest-ai-backend
    env: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: MODEL_DIR
        value: ml_pipeline/models

  # React Frontend (Vite)
  - type: web
    name: dataquest-ai-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      # Support for Single Page Application (SPA) routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false # Set this in Render Dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Set this in Render Dashboard
      - key: VITE_USE_ML_API
        value: "true"
      - key: VITE_ML_API_URL
        fromService:
          type: web
          name: dataquest-ai-backend
          property: host
